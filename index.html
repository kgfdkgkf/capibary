<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Милый Уголок Капибар — Cozy Meadow</title>
    <!-- Tailwind CSS for modern pastel UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #f0fdf4;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-button:hover {
            transform: translateY(-2px) scale(1.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .glass-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Pulsing indicator */
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .pulse-heart {
            animation: gentle-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between items-center select-none">

    <!-- Top HUD Navigation & Counters -->
    <header class="absolute top-3 left-0 right-0 z-20 px-4 max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2 pointer-events-none">
        
        <!-- Game Title Badge -->
        <div class="pointer-events-auto glass-panel px-4 py-2 rounded-2xl shadow-sm flex items-center gap-2">
            <span class="text-2xl">🍊</span>
            <div>
                <h1 class="font-extrabold text-base md:text-lg text-emerald-900 leading-tight">Милый Уголок Капибар</h1>
                <p class="text-xs text-emerald-700/80 font-semibold">Уютный луг и друзья</p>
            </div>
        </div>

        <!-- Counters Bar -->
        <div class="pointer-events-auto glass-panel px-4 py-2 rounded-2xl shadow-sm flex items-center gap-4 text-xs md:text-sm font-bold text-slate-700">
            <div class="flex items-center gap-1.5" title="Счастье питомцев">
                <span class="text-lg pulse-heart">💖</span>
                <span id="counter-happiness" class="text-rose-600 font-extrabold">0</span>
            </div>
            <div class="w-px h-5 bg-slate-300"></div>
            <div class="flex items-center gap-1.5" title="Выращено цветов">
                <span class="text-lg">🌸</span>
                <span id="counter-flowers" class="text-pink-600 font-extrabold">0</span>
            </div>
            <div class="w-px h-5 bg-slate-300"></div>
            <div class="flex items-center gap-1.5" title="Подарено угощений">
                <span class="text-lg">🍎</span>
                <span id="counter-treats" class="text-amber-600 font-extrabold">0</span>
            </div>
        </div>

        <!-- Time & Audio Controls -->
        <div class="pointer-events-auto flex items-center gap-2">
            <!-- Time of day toggle button -->
            <button id="btn-tod" class="glass-button p-2.5 rounded-2xl shadow-sm text-lg border border-white/60" title="Сменить время суток">
                🌅
            </button>
            <!-- Lo-Fi Music toggle button -->
            <button id="btn-music" class="glass-button p-2.5 rounded-2xl shadow-sm text-lg border border-white/60" title="Включить Lo-Fi музыку">
                🎵
            </button>
        </div>
    </header>

    <!-- Main Interactive Canvas -->
    <main class="w-full h-full absolute inset-0 z-0 cursor-pointer">
        <canvas id="meadowCanvas" class="w-full h-full block"></canvas>
    </main>

    <!-- Floating Help Hint -->
    <div id="click-hint" class="absolute top-20 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-opacity duration-700 glass-panel px-4 py-1.5 rounded-full text-xs font-bold text-emerald-800 shadow-sm border border-emerald-200 flex items-center gap-2">
        <span>✨ Нажмите в любом месте, чтобы позвать друзей или погладить их!</span>
    </div>

    <!-- Bottom Action Dock -->
    <footer class="absolute bottom-4 z-20 px-3 w-full max-w-xl mx-auto pointer-events-none">
        <div class="pointer-events-auto glass-panel p-2 rounded-3xl shadow-lg border border-white/80 flex items-center justify-around gap-1.5">
            
            <button id="btn-treat" class="glass-button flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-0.5 border border-amber-100/60 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🍏</span>
                <span class="text-xs font-extrabold text-amber-900">Угостить</span>
            </button>

            <button id="btn-flower" class="glass-button flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-0.5 border border-pink-100/60 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🌸</span>
                <span class="text-xs font-extrabold text-pink-900">Посадить</span>
            </button>

            <button id="btn-call" class="glass-button flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-0.5 border border-emerald-100/60 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🔔</span>
                <span class="text-xs font-extrabold text-emerald-900">Собрать</span>
            </button>

            <button id="btn-add-friend" class="glass-button flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-0.5 border border-purple-100/60 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🐥</span>
                <span class="text-xs font-extrabold text-purple-900">Позвать</span>
            </button>

        </div>
    </footer>

    <script>
        // --- WEB AUDIO API SYNTHESIZER & SOUND EFFECTS ---
        class CozyAudioEngine {
            constructor() {
                this.ctx = null;
                this.isMusicPlaying = false;
                this.tempo = 68;
                this.timer = null;
                this.step = 0;
                
                // Lo-Fi chord scale (A minor / C major pentatonic cozy progression)
                this.chords = [
                    [261.63, 329.63, 392.00, 493.88], // Cmaj7
                    [220.00, 261.63, 329.63, 392.00], // Am7
                    [174.61, 261.63, 329.63, 392.00], // Fmaj7
                    [196.00, 246.94, 293.66, 392.00]  // G7
                ];
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Play cozy synth chime sound
            playChime(freq = 523.25, duration = 0.8) {
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                // Lowpass filter for smooth soft tone
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            // Sound effect for petting
            playPetSound() {
                this.playChime(523.25, 0.4); // C5
                setTimeout(() => this.playChime(659.25, 0.5), 80); // E5
                setTimeout(() => this.playChime(783.99, 0.6), 160); // G5
            }

            // Sound effect for planting flowers
            playPlantSound() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.25);
                
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            // Sound effect for treat drop
            playTreatSound() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.2);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            // Toggle background ambient lo-fi synth music loop
            toggleMusic() {
                this.init();
                this.isMusicPlaying = !this.isMusicPlaying;

                if (this.isMusicPlaying) {
                    this.startLoFiLoop();
                } else {
                    clearInterval(this.timer);
                }
                return this.isMusicPlaying;
            }

            startLoFiLoop() {
                const interval = (60 / this.tempo) * 1000 * 2;
                this.timer = setInterval(() => {
                    if (!this.isMusicPlaying) return;

                    const chordIndex = Math.floor(this.step / 2) % this.chords.length;
                    const chord = this.chords[chordIndex];

                    chord.forEach((freq, idx) => {
                        setTimeout(() => {
                            if (!this.isMusicPlaying) return;
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            const filter = this.ctx.createBiquadFilter();

                            osc.type = 'triangle';
                            osc.frequency.value = freq;

                            filter.type = 'lowpass';
                            filter.frequency.value = 600;

                            const now = this.ctx.currentTime;
                            gain.gain.setValueAtTime(0.001, now);
                            gain.gain.linearRampToValueAtTime(0.04, now + 0.2);
                            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                            osc.connect(filter);
                            filter.connect(gain);
                            gain.connect(this.ctx.destination);

                            osc.start(now);
                            osc.stop(now + 2.6);
                        }, idx * 180);
                    });

                    this.step++;
                }, interval);
            }
        }

        const audio = new CozyAudioEngine();

        // --- GAME STATE & CONSTANTS ---
        const canvas = document.getElementById('meadowCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;

        // Counters
        let happinessCount = 0;
        let flowerCount = 0;
        let treatCount = 0;

        // Times of day: 0 = Day, 1 = Sunset, 2 = Night
        let timeOfDay = 0; 
        const TOD_LABELS = ['🌅 День', '🌆 Закат', '🌌 Ночь'];
        const TOD_ICONS = ['🌅', '🌆', '🌌'];

        // Color Palettes per Time of Day
        const PALETTES = [
            // Day
            {
                skyTop: '#bae6fd', skyBottom: '#f0fdf4',
                meadowTop: '#86efac', meadowBottom: '#4ade80',
                pond: '#60a5fa', pondEdge: '#93c5fd'
            },
            // Sunset
            {
                skyTop: '#fdba74', skyBottom: '#fbcfe8',
                meadowTop: '#fde047', meadowBottom: '#a3e635',
                pond: '#f472b6', pondEdge: '#fbcfe8'
            },
            // Night
            {
                skyTop: '#0f172a', skyBottom: '#1e1b4b',
                meadowTop: '#064e3b', meadowBottom: '#022c22',
                pond: '#1e3a8a', pondEdge: '#3b82f6'
            }
        ];

        // Arrays for canvas entities
        let animals = [];
        let flowers = [];
        let treats = [];
        let particles = [];
        let clouds = [];
        let fireflies = [];

        // --- RESIZE CANVAS ---
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Generate clouds if empty
            if (clouds.length === 0) {
                for (let i = 0; i < 5; i++) {
                    clouds.push({
                        x: Math.random() * width,
                        y: Math.random() * (height * 0.25),
                        speed: 0.15 + Math.random() * 0.2,
                        scale: 0.7 + Math.random() * 0.6
                    });
                }
            }

            // Generate fireflies if empty
            if (fireflies.length === 0) {
                for (let i = 0; i < 20; i++) {
                    fireflies.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // --- ANIMAL CLASS & PROCEDURAL CANVAS DRAWING ---
        class Animal {
            constructor(type, x, y) {
                this.type = type; // 'capybara', 'bunny', 'duckling', 'kitty'
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.speed = 1.2 + Math.random() * 0.6;
                this.size = 36;
                
                // Animation states
                this.state = 'idle'; // 'idle', 'walking', 'pet'
                this.bounceAnim = Math.random() * 100;
                this.blinkTimer = Math.random() * 200;
                this.isBlinking = false;
                this.petTimer = 0;
                this.facingLeft = false;

                // Unique color tweaks
                if (type === 'capybara') this.name = 'Капибара';
                else if (type === 'bunny') this.name = 'Зайчик';
                else if (type === 'duckling') this.name = 'Утёнок';
                else if (type === 'kitty') this.name = 'Котик';
            }

            update() {
                // Handle blinking
                this.blinkTimer++;
                if (this.blinkTimer > 180 + Math.random() * 120) {
                    this.isBlinking = true;
                    if (this.blinkTimer > 195 + Math.random() * 120) {
                        this.isBlinking = false;
                        this.blinkTimer = 0;
                    }
                }

                // Handle Petting Jump Animation
                if (this.state === 'pet') {
                    this.petTimer--;
                    if (this.petTimer <= 0) {
                        this.state = 'idle';
                    }
                }

                // Movement logic towards target
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 8) {
                    this.state = 'walking';
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    this.facingLeft = dx < 0;
                    this.bounceAnim += 0.18;
                } else {
                    if (this.state === 'walking') {
                        this.state = 'idle';
                    }
                    this.bounceAnim += 0.04;

                    // Random wander logic when idle
                    if (Math.random() < 0.003) {
                        this.targetX = Math.max(60, Math.min(width - 60, this.x + (Math.random() - 0.5) * 160));
                        this.targetY = Math.max(height * 0.4, Math.min(height - 70, this.y + (Math.random() - 0.5) * 120));
                    }
                }

                // Check for nearby treats
                for (let i = treats.length - 1; i >= 0; i--) {
                    const tr = treats[i];
                    const tDist = Math.hypot(tr.x - this.x, tr.y - this.y);
                    if (tDist < 20 && tr.fresh) {
                        tr.fresh = false;
                        spawnHearts(this.x, this.y - 30, 4);
                        happinessCount += 5;
                        treatCount++;
                        updateCounters();
                        audio.playPetSound();
                        
                        // Remove treat
                        treats.splice(i, 1);
                        break;
                    } else if (tDist < 200 && this.state !== 'pet' && Math.random() < 0.02) {
                        this.targetX = tr.x + (Math.random() - 0.5) * 10;
                        this.targetY = tr.y + (Math.random() - 0.5) * 10;
                    }
                }
            }

            draw(ctx) {
                ctx.save();

                // Compute bounce / jump offsets
                let bounceY = Math.sin(this.bounceAnim) * (this.state === 'walking' ? 5 : 2);
                if (this.state === 'pet') {
                    bounceY = -Math.abs(Math.sin(this.petTimer * 0.2)) * 18;
                }

                const drawX = this.x;
                const drawY = this.y + bounceY;

                // Shadow
                ctx.beginPath();
                ctx.ellipse(drawX, this.y + 12, 20, 8, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                ctx.fill();

                ctx.translate(drawX, drawY);
                if (this.facingLeft) {
                    ctx.scale(-1, 1);
                }

                // --- PROCEDURAL CHARACTER DRAWING ---
                if (this.type === 'capybara') {
                    // Body
                    ctx.fillStyle = '#b47b48';
                    ctx.beginPath();
                    ctx.roundRect(-22, -16, 44, 28, [14, 16, 12, 10]);
                    ctx.fill();

                    // Head
                    ctx.beginPath();
                    ctx.roundRect(4, -22, 22, 22, [10, 12, 8, 8]);
                    ctx.fill();

                    // Ears
                    ctx.fillStyle = '#8c592e';
                    ctx.beginPath();
                    ctx.arc(8, -20, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Snout
                    ctx.fillStyle = '#7a4a25';
                    ctx.beginPath();
                    ctx.roundRect(16, -15, 12, 12, [4, 6, 6, 4]);
                    ctx.fill();

                    // Nose / Mouth
                    ctx.strokeStyle = '#4a2c11';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(24, -10);
                    ctx.lineTo(24, -7);
                    ctx.stroke();

                    // Eyes (blinking)
                    ctx.fillStyle = '#2d1a0a';
                    if (this.isBlinking) {
                        ctx.beginPath();
                        ctx.moveTo(14, -13);
                        ctx.lineTo(18, -13);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(16, -13, 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Blush
                    ctx.fillStyle = 'rgba(244, 114, 182, 0.4)';
                    ctx.beginPath();
                    ctx.arc(12, -8, 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    // MANDARIN ON HEAD 🍊
                    ctx.fillStyle = '#f97316'; // Orange
                    ctx.beginPath();
                    ctx.arc(14, -26, 6, 0, Math.PI * 2);
                    ctx.fill();
                    // Leaf
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.ellipse(14, -32, 2, 4, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'bunny') {
                    // Bunny Body
                    ctx.fillStyle = '#f8fafc';
                    ctx.beginPath();
                    ctx.roundRect(-16, -14, 32, 26, [14, 14, 10, 10]);
                    ctx.fill();

                    // Bunny Ears
                    ctx.fillStyle = '#f8fafc';
                    ctx.beginPath();
                    ctx.ellipse(-4, -26, 4, 12, -0.1, 0, Math.PI * 2);
                    ctx.ellipse(4, -26, 4, 12, 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner Pink Ears
                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.ellipse(-4, -26, 2, 8, -0.1, 0, Math.PI * 2);
                    ctx.ellipse(4, -26, 2, 8, 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#334155';
                    if (this.isBlinking) {
                        ctx.strokeStyle = '#334155';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(4, -6);
                        ctx.lineTo(8, -6);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(6, -6, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Pink Nose
                    ctx.fillStyle = '#fb7185';
                    ctx.beginPath();
                    ctx.arc(10, -3, 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-17, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'duckling') {
                    // Duck Body
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.ellipse(-2, -6, 16, 14, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Duck Head
                    ctx.beginPath();
                    ctx.arc(8, -16, 11, 0, Math.PI * 2);
                    ctx.fill();

                    // Beak
                    ctx.fillStyle = '#fb923c';
                    ctx.beginPath();
                    ctx.roundRect(14, -16, 10, 6, [3]);
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#1e293b';
                    if (!this.isBlinking) {
                        ctx.beginPath();
                        ctx.arc(10, -18, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Wing
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.ellipse(-4, -4, 8, 5, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'kitty') {
                    // Kitty Body (Peach Tabby)
                    ctx.fillStyle = '#fb923c';
                    ctx.beginPath();
                    ctx.roundRect(-16, -12, 32, 24, [12, 12, 8, 8]);
                    ctx.fill();

                    // Pointy Ears
                    ctx.beginPath();
                    ctx.moveTo(2, -14);
                    ctx.lineTo(7, -24);
                    ctx.lineTo(12, -12);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-10, -14);
                    ctx.lineTo(-5, -24);
                    ctx.lineTo(0, -12);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#0f172a';
                    if (this.isBlinking) {
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(6, -6);
                        ctx.lineTo(10, -6);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(8, -6, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Tail
                    ctx.strokeStyle = '#fb923c';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-16, 2);
                    ctx.quadraticCurveTo(-26, -10, -22, -18);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Trigger pet interaction
            pet() {
                this.state = 'pet';
                this.petTimer = 40;
                spawnHearts(this.x, this.y - 30, 6);
                happinessCount += 3;
                updateCounters();
                audio.playPetSound();
            }
        }

        // --- INITIALIZE GAME OBJECTS ---
        function initEntities() {
            animals = [
                new Animal('capybara', width * 0.4, height * 0.65),
                new Animal('bunny', width * 0.55, height * 0.7),
                new Animal('duckling', width * 0.3, height * 0.75),
                new Animal('kitty', width * 0.65, height * 0.6)
            ];

            // Default flowers
            flowers = [
                { x: width * 0.2, y: height * 0.6, type: '🌸', size: 24 },
                { x: width * 0.8, y: height * 0.65, type: '🌼', size: 22 },
                { x: width * 0.35, y: height * 0.8, type: '🌷', size: 26 },
                { x: width * 0.7, y: height * 0.82, type: '🌻', size: 28 }
            ];
            flowerCount = flowers.length;
            updateCounters();
        }

        // Particle Generators (Hearts & Sparkles)
        function spawnHearts(x, y, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 20,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -1.5 - Math.random() * 2,
                    scale: 0.8 + Math.random() * 0.6,
                    alpha: 1,
                    text: Math.random() > 0.3 ? '💖' : '✨'
                });
            }
        }

        // --- MAIN CANVAS RENDER LOOP ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            const palette = PALETTES[timeOfDay];

            // 1. Draw Sky Gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height * 0.55);
            skyGradient.addColorStop(0, palette.skyTop);
            skyGradient.addColorStop(1, palette.skyBottom);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height * 0.55);

            // 2. Draw Stars (at Night)
            if (timeOfDay === 2) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 40; i++) {
                    const sx = (Math.sin(i * 99 + Date.now() * 0.0005) * 0.5 + 0.5) * width;
                    const sy = (Math.cos(i * 33) * 0.5 + 0.5) * (height * 0.4);
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.random() * 1.5 + 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 3. Draw Clouds
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > width + 100) cloud.x = -100;

                ctx.fillStyle = timeOfDay === 2 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, 25 * cloud.scale, 0, Math.PI * 2);
                ctx.arc(cloud.x + 20 * cloud.scale, cloud.y - 10 * cloud.scale, 30 * cloud.scale, 0, Math.PI * 2);
                ctx.arc(cloud.x + 45 * cloud.scale, cloud.y, 22 * cloud.scale, 0, Math.PI * 2);
                ctx.fill();
            });

            // 4. Draw Meadow Grass Gradient
            const meadowGradient = ctx.createLinearGradient(0, height * 0.45, 0, height);
            meadowGradient.addColorStop(0, palette.meadowTop);
            meadowGradient.addColorStop(1, palette.meadowBottom);
            ctx.fillStyle = meadowGradient;

            ctx.beginPath();
            ctx.moveTo(0, height * 0.48);
            ctx.quadraticCurveTo(width * 0.5, height * 0.42, width, height * 0.48);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

            // 5. Draw Cozy Pond
            const pondX = width * 0.25;
            const pondY = height * 0.56;
            ctx.fillStyle = palette.pondEdge;
            ctx.beginPath();
            ctx.ellipse(pondX, pondY, 95, 45, -0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = palette.pond;
            ctx.beginPath();
            ctx.ellipse(pondX, pondY, 85, 38, -0.1, 0, Math.PI * 2);
            ctx.fill();

            // Water Ripple Animation
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            const rippleR = (Date.now() * 0.02) % 35;
            ctx.beginPath();
            ctx.ellipse(pondX - 10, pondY + 5, rippleR, rippleR * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();

            // Lily pads
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(pondX + 30, pondY - 10, 10, 0, Math.PI * 1.7);
            ctx.fill();

            // 6. Draw Planted Flowers
            flowers.forEach(fl => {
                ctx.font = `${fl.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(fl.type, fl.x, fl.y);
            });

            // 7. Draw Dropped Treats
            treats.forEach(tr => {
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(tr.type, tr.x, tr.y);
            });

            // 8. Update & Draw Animals Sorted by Y Depth
            animals.sort((a, b) => a.y - b.y);
            animals.forEach(animal => {
                animal.update();
                animal.draw(ctx);
            });

            // 9. Draw Particles (Hearts & Sparkles)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.font = `${Math.floor(20 * p.scale)}px sans-serif`;
                    ctx.fillText(p.text, p.x, p.y);
                    ctx.restore();
                }
            }

            // 10. Night Fireflies
            if (timeOfDay === 2) {
                fireflies.forEach(ff => {
                    ff.x += ff.vx;
                    ff.y += ff.vy;
                    ff.phase += 0.05;

                    if (ff.x < 0) ff.x = width;
                    if (ff.x > width) ff.x = 0;
                    if (ff.y < 0) ff.y = height;
                    if (ff.y > height) ff.y = 0;

                    const alpha = Math.sin(ff.phase) * 0.5 + 0.5;
                    ctx.fillStyle = `rgba(250, 204, 21, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(ff.x, ff.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            requestAnimationFrame(render);
        }

        // --- UPDATE HUD COUNTERS ---
        function updateCounters() {
            document.getElementById('counter-happiness').innerText = happinessCount;
            document.getElementById('counter-flowers').innerText = flowerCount;
            document.getElementById('counter-treats').innerText = treatCount;
        }

        // --- INTERACTION CONTROLS ---

        // Handle Canvas Clicks / Taps
        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Hide initial hint
            const hint = document.getElementById('click-hint');
            if (hint) hint.style.opacity = '0';

            // 1. Check if an animal was clicked (Petting)
            let animalPet = false;
            for (let animal of animals) {
                const dist = Math.hypot(animal.x - clickX, (animal.y - 10) - clickY);
                if (dist < 40) {
                    animal.pet();
                    animalPet = true;
                    break;
                }
            }

            // 2. If ground was clicked -> All animals walk to location
            if (!animalPet && clickY > height * 0.45) {
                animals.forEach(animal => {
                    animal.targetX = clickX + (Math.random() - 0.5) * 60;
                    animal.targetY = clickY + (Math.random() - 0.5) * 40;
                });
                // Little click sparkle effect
                spawnHearts(clickX, clickY, 2);
            }
        }

        canvas.addEventListener('click', handleCanvasClick);

        // Drop Treat Button
        document.getElementById('btn-treat').addEventListener('click', () => {
            const treatTypes = ['🍎', '🍓', '🍉', '🥕'];
            const treat = treatTypes[Math.floor(Math.random() * treatTypes.length)];
            const tx = width * 0.3 + Math.random() * (width * 0.4);
            const ty = height * 0.6 + Math.random() * (height * 0.25);

            treats.push({ x: tx, y: ty, type: treat, fresh: true });
            audio.playTreatSound();
            spawnHearts(tx, ty, 3);

            // Call nearest animals to treat
            animals.forEach(a => {
                a.targetX = tx + (Math.random() - 0.5) * 20;
                a.targetY = ty + (Math.random() - 0.5) * 20;
            });
        });

        // Plant Flower Button
        document.getElementById('btn-flower').addEventListener('click', () => {
            const flowerTypes = ['🌸', '🌺', '🌼', '🌷', '🌻', '🪻'];
            const fl = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
            const fx = width * 0.15 + Math.random() * (width * 0.7);
            const fy = height * 0.52 + Math.random() * (height * 0.35);

            flowers.push({ x: fx, y: fy, type: fl, size: 22 + Math.random() * 8 });
            flowerCount = flowers.length;
            updateCounters();
            audio.playPlantSound();
            spawnHearts(fx, fy - 10, 3);
        });

        // Call All Friends Button
        document.getElementById('btn-call').addEventListener('click', () => {
            const centerX = width * 0.5;
            const centerY = height * 0.68;
            animals.forEach((a, i) => {
                a.targetX = centerX + (i - 1.5) * 50;
                a.targetY = centerY + (Math.random() - 0.5) * 20;
            });
            audio.playChime(659.25, 0.5);
            spawnHearts(centerX, centerY - 20, 8);
        });

        // Add Extra Friend Button
        document.getElementById('btn-add-friend').addEventListener('click', () => {
            const types = ['capybara', 'bunny', 'duckling', 'kitty'];
            const chosen = types[Math.floor(Math.random() * types.length)];
            const newAnimal = new Animal(chosen, width * 0.5, height * 0.5);
            animals.push(newAnimal);
            audio.playPetSound();
            spawnHearts(width * 0.5, height * 0.5, 6);
        });

        // Time of Day Toggle Button
        document.getElementById('btn-tod').addEventListener('click', () => {
            timeOfDay = (timeOfDay + 1) % 3;
            document.getElementById('btn-tod').innerText = TOD_ICONS[timeOfDay];
        });

        // Lo-Fi Music Toggle Button
        document.getElementById('btn-music').addEventListener('click', () => {
            const isPlaying = audio.toggleMusic();
            document.getElementById('btn-music').innerText = isPlaying ? '🔊' : '🎵';
            document.getElementById('btn-music').classList.toggle('bg-emerald-100', isPlaying);
        });

        // --- STARTUP ---
        window.onload = () => {
            resizeCanvas();
            initEntities();
            render();
        };

    </script>
</body>
</html>
